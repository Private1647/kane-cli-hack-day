  # ── webhooks + MCP (implemented) ──────────────────────────────────────────
  /webhooks/github:
    post:
      tags: [webhooks]
      operationId: githubWebhook
      x-implemented: kane-mcp
      summary: "GitHub App: HMAC over raw body, X-GitHub-Delivery dedupe, push → repository_links + commit timeline. Permissions: contents:read, metadata:read."
      security: [{ GitHubSignature: [] }]
      parameters:
        - { name: X-GitHub-Delivery, in: header, required: true, schema: { type: string } }
        - { name: X-GitHub-Event, in: header, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ ok, duplicate? , status?, detail? }" }
        "401": { description: Bad signature }
        "503": { description: GITHUB_WEBHOOK_SECRET not configured }
  /webhooks/renderer:
    post:
      tags: [webhooks]
      operationId: rendererWebhook
      x-implemented: kane-mcp
      security: [{ RendererSignature: [] }]
      parameters: [{ name: X-Renderer-Delivery, in: header, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RenderCallback" } } } }
      responses:
        "200": { description: "{ ok, applied, status }" }
        "401": { description: Bad signature }
  /webhooks/luma:
    post: { tags: [webhooks], operationId: lumaWebhook, x-owner: admissions-ops, summary: "Only if Luma Plus is confirmed; CSV import is the default", security: [{ GitHubSignature: [] }], responses: { "200": { description: ok } } }
  /mcp:
    post:
      tags: [mcp]
      operationId: mcp
      x-implemented: kane-mcp
      summary: "Streamable HTTP MCP, stateless JSON. Tools: event_get_brief, participant_get_status, participant_update_profile, activation_begin, activation_get_checkpoint, readiness_report, team_find, team_create, team_join, idea_validate, idea_check_overlap, harness_get_capabilities, kane_record_run, milestone_propose, help_diagnose, help_create, help_get_status, submission_preflight, submission_finalize, demo_generate, deck_get, deck_update, showcase_preview, showcase_publish, social_draft. Each returns an Envelope as JSON text content. social_publish is not exposed."
      security: [{ BearerAuth: [] }]
      parameters: [{ name: Accept, in: header, required: true, schema: { const: "application/json, text/event-stream" } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, description: JSON-RPC 2.0 } } } }
      responses:
        "200": { description: JSON-RPC response }
        "401": { description: Missing/invalid token (Envelope) }
        "405": { description: GET/DELETE not offered (stateless) }
        "503": { description: mcp flag off }

